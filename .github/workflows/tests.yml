name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Run pytest
        # python -m pytest statt pytest: nutzt das CI-venv explizit;
        # unset PYTHONPATH verhindert jede venv-Kontamination (pydantic_core-Mismatch)
        # --benchmark-json: Perf-Gates (Phase 4 Item 17) liefern einen
        # JSON-Report als Artefakt; Toleranz-Gates (test_bench_gates.py)
        # laufen im selben Durchlauf und FAILen bei Regression.
        run: >-
          unset PYTHONPATH
          python -m pytest tests/ -v --tb=short --no-header -q
          --ignore=tests/test_vision_learning.py
          --ignore=tests/test_gui_automation.py
          --ignore=tests/test_vision.py
          --ignore=tests/test_finding_01_screenshot_crossplatform.py
          --benchmark-json=.benchmarks/bench.json
        env:
          MIMI_NOX_MODEL: mock
          MIMI_NOX_OFFLINE: "1"
          MIMI_NOX_MEMORY_DIR: /tmp/mimi-nox-ci-memory

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.python-version }}
          path: .benchmarks/
          if-no-files-found: ignore

      - name: Installer-Syntax-Check (Release-Bar)
        run: |
          bash -n install.sh && echo "install.sh OK"
          pwsh -NoProfile -Command "$ErrorActionPreference='Stop'; $t=0;$e=0; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install.ps1'),[ref]$t,[ref]$e) | Out-Null; if ($e.Count) { $e | ForEach-Object { Write-Error $_.ToString() }; exit 1 }; Write-Host 'install.ps1 OK'"

  docker-build:
    name: Docker image build (release-bar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t miminox:ci .
      - name: Verify installed package
        run: docker run --rm --entrypoint python miminox:ci -c "import miminox; import miminox_cli; print('miminox import OK')"
