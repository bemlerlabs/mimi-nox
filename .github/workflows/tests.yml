name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # pytest-Suite ist lokal-only (tests/ nicht im öffentlichen Repo).
  # CI prüft stattdessen: Installer-Syntax, Docker-Build, Python-Import-Integrität.
  integration:
    name: Integration checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # CI-Python-Parity (test_sprint2_f2_pwa_hygiene.py):
        # Untergrenze = requires-python (>=3.10), lokales venv (3.13) in der
        # Matrix, alle Eintraege innerhalb der pyproject-Classifiers.
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e "."

      - name: Verify package import
        run: |
          python -c "import miminox; import miminox_cli; import core.engine_config; import server.main; print('All core imports OK')"

      - name: Installer-Syntax-Check (Release-Bar)
        run: |
          bash -n install.sh && echo "install.sh OK"
          pwsh -NoProfile -Command "[void][System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$null) | Out-Null; Write-Host 'install.ps1 OK'"

      - name: Security defaults audit (conservative binding)
        run: |
          python -c "
          import re, pathlib
          src = pathlib.Path('server/main.py').read_text()
          # Server muss nicht auf 0.0.0.0 binden (Mobile-Access ist opt-in)
          assert '0.0.0.0' not in src, 'SECURITY: Server binds to 0.0.0.0 by default'
          print('Security defaults OK: no wildcard bind')
          "

  docker-build:
    name: Docker image build (release-bar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t miminox:ci .
      - name: Verify installed package
        run: docker run --rm --entrypoint python miminox:ci -c "import miminox; import miminox_cli; print('miminox import OK')"
