name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Run pytest
        run: >-
          pytest tests/ -v --tb=short --no-header -q
          --ignore=tests/test_vision_learning.py
          --ignore=tests/test_gui_automation.py
          --ignore=tests/test_vision.py
          --ignore=tests/test_finding_01_screenshot_crossplatform.py
        env:
          MIMI_NOX_MODEL: mock
          MIMI_NOX_OFFLINE: "1"
          MIMI_NOX_MEMORY_DIR: /tmp/mimi-nox-ci-memory
