# Frontend CI/CD Pipeline
name: Frontend Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Type check
        run: cd app && npx tsc --noEmit

      - name: Build
        run: cd app && npm run build

      - name: Lint
        run: cd app && npm run lint || echo "Lint warnings (non-blocking)"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: app/dist/
          retention-days: 7
