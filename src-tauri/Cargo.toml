[package]
name = "mimi-nox"
version = "1.0.0"
description = "MiMi Nox — Local AI Assistant with Tool-Use"
authors = ["MiMi Tech AI"]
license = "Apache-2.0"
repository = "https://github.com/MimiTechAi/mimi-nox"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }
