<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020504" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="description" content="◑ MiMi Nox – Chat" />
  <title>◑ MiMi Nox</title>
  <link rel="manifest" href="manifest.json" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ── Design Tokens (aus Schwarzwald Edition) ── */
    :root {
      --bg: #020504;
      --panel: #040a04;
      --bubble-user: #134e1c;
      --bubble-ai: #080f08;
      --green: #22c55e;
      --green-light: #4ade80;
      --green-dim: #166534;
      --text: #f0fdf4;
      --text-muted: #6b7280;
      --text-dim: #374151;
      --font-main: "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --topbar-h: 52px;
    }

    /* ── Tactical Mode (Crisis Mode) ── */
    [data-theme='tactical'] {
      --bg: #050705;
      --panel: #0a0f0a;
      --bubble-user: #0e2a14;
      --bubble-ai: #070d07;
      --green: #ff9800; /* Tactical Amber for priority */
      --green-light: #ffb74d;
      --green-dim: #92400e;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      font-family: var(--font-mono); /* Force mono for everything in tactical mode */
    }

    [data-theme='tactical'] .logo-icon {
      color: var(--green);
      filter: drop-shadow(0 0 8px rgba(255,152,0,0.6));
    }
    
    [data-theme='tactical'] .logo-name::after {
      content: " [CRISIS MODE]";
      font-size: 10px;
      color: #ef4444;
      vertical-align: top;
      margin-left: 4px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      font-size: 15px;
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout: Header + Chat + Input ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh; /* Dynamic viewport height für mobile */
    }

    /* ── Header (Fix 2: sticky) ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--topbar-h);
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      background: rgba(4, 10, 4, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(34, 197, 94, 0.08);
      flex-shrink: 0;
      z-index: 10;
      position: sticky;
      top: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      font-size: 28px;
      color: var(--green);
      filter: drop-shadow(0 0 8px rgba(34,197,94,0.6));
      animation: pulse-glow 3s infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(34,197,94,0.6)); }
      50%       { filter: drop-shadow(0 0 14px rgba(34,197,94,0.9)); }
    }
    .logo-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2s infinite;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 6px var(--green); }
      50%       { box-shadow: 0 0 12px var(--green); }
    }
    /* Fix 5: btn-clear min 36px tall for thumb targeting */
    .btn-clear {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      font-size: 13px;
      padding: 6px 14px;
      min-height: 36px;
      border-radius: 18px;
      cursor: pointer;
      font-family: var(--font-main);
      transition: all 0.2s;
    }
    .btn-clear:active {
      background: rgba(34,197,94,0.15);
      border-color: var(--green-dim);
      color: var(--green-light);
    }

    /* ── Chat Area ── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { display: none; }

    /* Willkommen */
    .welcome-msg {
      text-align: center;
      padding: 60px 20px 30px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .welcome-msg .icon { font-size: 40px; display: block; margin-bottom: 12px; color: var(--green); filter: drop-shadow(0 0 12px rgba(34,197,94,0.6)); }
    .welcome-msg .title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px; }

    /* Bubbles */
    .msg { max-width: 88%; animation: slide-in 0.15s ease-out; }
    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 18px 18px 4px 18px;
      font-size: 15px;
      line-height: 1.5;
    }
    .msg.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      border: 1px solid rgba(34,197,94,0.06);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 18px 18px 18px 4px;
      font-size: 15px;
      line-height: 1.6;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Thinking-Indicator */
    .thinking {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 8px 0;
      color: var(--green-dim);
      font-size: 12px;
      font-family: var(--font-mono);
    }
    .thinking .dots span {
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: dot-bounce 1.2s infinite;
    }
    .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    /* Streaming cursor blink */
    .msg.ai.streaming::after {
      content: "▊";
      color: var(--green);
      animation: blink 0.8s infinite;
      margin-left: 1px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Vorlesen-Button */
    .speak-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      margin-top: 4px;
      border-radius: 10px;
      font-family: var(--font-main);
      transition: all 0.2s;
    }
    .speak-btn:active { color: var(--green); background: rgba(34,197,94,0.08); }

    /* ── Markdown in AI Bubbles ── */
    .msg.ai p { margin-bottom: 8px; }
    .msg.ai p:last-child { margin-bottom: 0; }
    .msg.ai ul, .msg.ai ol { padding-left: 18px; margin-bottom: 8px; }
    .msg.ai li { margin-bottom: 3px; }
    .msg.ai strong { color: var(--green-light); font-weight: 600; }
    .msg.ai em { color: #d1fae5; }
    .msg.ai h1, .msg.ai h2, .msg.ai h3 { color: var(--green-light); margin: 10px 0 6px; font-weight: 700; }
    .msg.ai h1 { font-size: 17px; }
    .msg.ai h2 { font-size: 15px; }
    .msg.ai h3 { font-size: 13px; }
    .msg.ai code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.12);
      padding: 1px 5px;
      border-radius: 4px;
      color: #86efac;
    }
    .msg.ai pre {
      background: rgba(2,5,4,0.9);
      border: 1px solid rgba(34,197,94,0.08);
      border-left: 3px solid var(--green-dim);
      border-radius: 4px 8px 8px 4px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg.ai pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--green-light);
      line-height: 1.6;
    }
    .msg.ai a { color: var(--green); text-decoration: underline; }
    .msg.ai blockquote {
      border-left: 3px solid var(--green-dim);
      padding-left: 10px;
      color: var(--text-muted);
      margin: 6px 0;
    }

    /* ── Input Bar (Fix 3: safe-area fallback) ── */
    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(12px, calc(10px + env(safe-area-inset-bottom, 12px)));
      background: rgba(4, 10, 4, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(34, 197, 94, 0.06);
      flex-shrink: 0;
    }
    .input-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: rgba(8, 15, 8, 0.9);
      border: 1px solid rgba(34, 197, 94, 0.1);
      border-radius: 22px;
      padding: 6px 6px 6px 14px;
      gap: 6px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.12);
    }
    .chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 16px;
      line-height: 1.4;
      resize: none;
      max-height: 100px;
      overflow-y: auto;
    }
    .chat-input::placeholder { color: var(--text-dim); }
    /* Fix 4: touch targets 44×44px (Apple HIG / Google MD minimum) */
    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--green);
      color: var(--bg);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { background: var(--green-dim); }
    .send-btn.stop { background: #ef4444; }
    .mic-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--green-light);
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .mic-btn:active { background: rgba(34,197,94,0.1); }
    .mic-btn.recording {
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      animation: mic-pulse 1.5s infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50%      { box-shadow: 0 0 10px 3px rgba(239,68,68,0.15); }
    }
    /* Kamera-Button (E4B Vision) */
    .camera-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .camera-btn:active { background: rgba(34,197,94,0.1); color: var(--green); }
    .camera-btn.has-image { color: var(--green); background: rgba(34,197,94,0.1); }

    /* ── Toast Notification ── */
    .toast {
      position: fixed;
      top: calc(var(--topbar-h) + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(4, 14, 6, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--green-dim);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: var(--green-light);
      font-family: var(--font-mono);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Welcome Cards (Fix 10) ── */
    .welcome-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      width: 100%;
      max-width: 300px;
    }
    .welcome-card {
      background: rgba(8, 15, 8, 0.8);
      border: 1px solid rgba(34, 197, 94, 0.1);
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .welcome-card:active {
      background: rgba(19, 78, 28, 0.3);
      border-color: var(--green-dim);
      color: var(--text);
    }
    .welcome-card .card-icon { font-size: 16px; }

    /* ── Skill Chips (Fix 11) ── */
    .skill-chips {
      display: flex;
      gap: 6px;
      padding: 6px 12px;
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .skill-chips::-webkit-scrollbar { display: none; }
    .skill-chip {
      background: transparent;
      border: 1px solid var(--green-dim);
      color: var(--green-light);
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 100px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .skill-chip:active {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--green);
    }

    /* ── Status text (Fix 15) ── */
    .status-label {
      font-size: 11px;
      color: var(--green);
      font-weight: 500;
    }
    .status-label.offline {
      color: #ef4444;
    }

    /* ── Utility ── */
    .hidden { display: none !important; }

    /* ── Thinking Bubble (E4B Thinking Mode) ── */
    .mobile-thinking {
      align-self: flex-start;
      background: rgba(34, 197, 94, 0.04);
      border: 1px solid rgba(34, 197, 94, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 4px;
      max-width: 88%;
      animation: slide-in 0.2s ease-out;
      transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
      max-height: 200px;
      overflow: hidden;
    }
    .mobile-thinking.collapsed {
      max-height: 0;
      opacity: 0;
      padding: 0 12px;
      margin: 0;
      border-color: transparent;
    }
    /* ── Tab Bar ── */
    .nav-tabs {
      display: flex;
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid var(--gray-800);
      gap: 2px;
    }
    .nav-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 10px;
      cursor: pointer;
      position: relative;
    }
    .nav-tab.active {
      color: var(--green);
      background: rgba(34,197,94,0.05);
    }
    .nav-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .think-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--green-dim);
      display: block;
      margin-bottom: 4px;
    }
    .think-text {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      line-height: 1.5;
      display: block;
      max-height: 150px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .think-text::-webkit-scrollbar { display: none; }

    /* ── Swarm Dashboard (Mobile) ── */
    .mobile-swarm {
      align-self: flex-start;
      background: rgba(4, 14, 6, 0.6);
      border: 1px solid rgba(34, 197, 94, 0.12);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 6px;
      max-width: 88%;
      animation: slide-in 0.2s ease-out;
    }
    .sw-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--green-light);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .sw-header.sw-complete { color: var(--green); }
    .sw-phase {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-dim);
      background: rgba(34, 197, 94, 0.06);
      border: 1px solid rgba(34, 197, 94, 0.1);
      padding: 1px 6px;
      border-radius: 100px;
      margin-left: auto;
    }
    .sw-agents { display: flex; flex-direction: column; gap: 5px; }
    .sw-agent {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 5px 8px;
      background: rgba(2, 5, 4, 0.5);
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 8px;
      animation: slide-in 0.2s ease-out;
    }
    .sw-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sw-role {
      font-weight: 700;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--green);
    }
    .sw-task {
      color: var(--text-muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Status colors */
    .sw-agent.spawned .sw-dot { background: #fbbf24; box-shadow: 0 0 4px rgba(251,191,36,0.4); }
    .sw-agent.spawned { border-color: rgba(251,191,36,0.1); }
    .sw-agent.running .sw-dot { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.5); animation: sw-pulse 1.5s infinite; }
    .sw-agent.running { border-color: rgba(34,197,94,0.15); }
    .sw-agent.done .sw-dot, .sw-agent.terminated .sw-dot { background: var(--green); }
    .sw-agent.done, .sw-agent.terminated { opacity: 0.6; }
    .sw-agent.error .sw-dot { background: #ef4444; box-shadow: 0 0 4px rgba(239,68,68,0.4); }
    .sw-agent.error { border-color: rgba(239,68,68,0.15); }
    @keyframes sw-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 4px rgba(34,197,94,0.4); }
      50%      { transform: scale(1.2); box-shadow: 0 0 8px rgba(34,197,94,0.7); }
    }
  </style>
</head>
<body>

  <div class="app">
    <!-- Header (Fix 15: status label) -->
    <div class="nav-tabs">
      <button class="nav-tab active" id="tabAgents">AGENTEN</button>
      <button class="nav-tab" id="tabMesh">HERMES (MESH)</button>
    </div>
    <header class="header">
      <div class="header-left">
        <span class="logo-icon">◑</span>
        <span class="logo-name">MiMi Nox</span>
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Online</span>
      </div>
      <button class="btn-clear" id="btn-clear">✨ Neu</button>
    </header>

    <!-- Main Chat Window (Fix 4 & 5: padding) -->
    <main class="chat" id="chat">
      <!-- Welcome card and Agent messages go here -->
    </main>

    <!-- Mesh Chat Window (T-4.1) -->
    <main class="chat hidden" id="meshChat">
      <div class="msg ai system">
        <div class="content">📡 LOKALES MESH-NETZWERK AKTIVIERT. Alle Nachrichten werden an verbundene Geräte im lokalen WLAN übertragen.</div>
      </div>
    </main>

    <div class="welcome-msg" id="welcome">
        <span class="icon">◑</span>
        <div class="title">Hey 👋</div>
        <span id="mobile-welcome-text">Schreib mir – ich bin dein lokaler KI-Agent.</span>
        <!-- Fix 10: Welcome Cards -->
        <div class="welcome-cards" id="welcome-cards">
          <button class="welcome-card" data-prompt="/medic Medizinischer Notfall - Was ist zu tun?">
            <span class="card-icon">🚑</span>
            <span data-i18n="crisis.medic_card">Medizinische Hilfe</span>
          </button>
          <button class="welcome-card" data-prompt="/repair Wie repariere ich ein technisches Gerät?">
            <span class="card-icon">🛠️</span>
            <span data-i18n="crisis.repair_card">Reparatur & Tech</span>
          </button>
          <button class="welcome-card" data-prompt="/map Wo befinde ich mich und wie ist das Gelände?">
            <span class="card-icon">🗺️</span>
            <span data-i18n="crisis.map_card">Navigation</span>
          </button>
          <button class="welcome-card" data-prompt="/power Wie ist der aktuelle System- und Energiestatus?">
            <span class="card-icon">⚡</span>
            <span data-i18n="crisis.power_card">Energie-Status</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Fix 11: Skill Chips -->
    <div class="skill-chips" id="mobile-skill-chips">
      <button class="skill-chip" data-trigger="/medic">🚑 /medic</button>
      <button class="skill-chip" data-trigger="/repair">🛠️ /repair</button>
      <button class="skill-chip" data-trigger="/map">🗺️ /map</button>
      <button class="skill-chip" data-trigger="/power">⚡ /power</button>
      <button class="skill-chip" data-trigger="/swarm">🐝 /swarm</button>
    </div>

    <!-- Power Monitor -->
    <div id="power-monitor" style="display:flex; justify-content: space-between; padding: 4px 14px; font-size: 10px; font-family:var(--font-mono); color: var(--text-dim); background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.03);">
      <span id="pwr-cpu">CPU: --%</span>
      <span id="pwr-mem">MEM: --/-- MB</span>
      <span id="pwr-upt">UP: --:--</span>
    </div>

    <!-- Input -->
    <div class="input-bar">
      <!-- Bild-Vorschau (mobile) -->
      <div id="img-preview-bar" style="display:none; align-items:center; gap:8px; padding:5px 12px; background:rgba(34,197,94,0.06); font-size:12px; color:#4ade80">
        <img id="img-preview-thumb" src="" alt="" style="width:32px;height:32px;object-fit:cover;border-radius:4px" />
        <span id="img-preview-name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px"></span>
        <button id="img-remove-btn" style="background:none;border:none;color:#ef4444;font-size:16px;cursor:pointer;padding:2px 6px">×</button>
      </div>
      <div class="input-wrap">
        <!-- Kamera / Galerie (E4B Vision) -->
        <input type="file" id="img-input" accept="image/*,image/heic,image/heif" style="display:none" />
        <button class="camera-btn" id="camera-btn" title="📷 Foto / Galerie">📷</button>
        <textarea class="chat-input" id="input" rows="1" placeholder="Message…" autocomplete="off" autocorrect="off" spellcheck="true"></textarea>
        <button class="mic-btn" id="mic-btn">🎙️</button>
        <button class="send-btn" id="send-btn">➤</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const API = '/api';
    const MODEL = 'gemma4:e4b';

    // ── i18n (lightweight, inline) ──
    const _lang = (localStorage.getItem('mimi-nox-lang') || navigator.language || 'en').substring(0, 2);
    const isDE = _lang === 'de';
    if (isDE) {
      document.documentElement.lang = 'de';
      document.getElementById('btn-clear').textContent = '✨ Neu';
      document.getElementById('mobile-welcome-text').textContent = 'Schreib mir – ich bin dein lokaler KI-Agent.';
      document.getElementById('input').placeholder = 'Nachricht…';
    }
    const _t = (de, en) => isDE ? de : en;

    const $ = id => document.getElementById(id);
    const chat = $('chat');
    const input = $('input');
    const sendBtn = $('send-btn');
    const micBtn = $('mic-btn');
    const welcome = $('welcome');
    const toast = $('toast');
    const statusDot = $('status-dot');

    let currentTab = 'agents';
    let survivorName = localStorage.getItem('survivor_name') || 'Survivor_' + Math.floor(Math.random()*1000);

    // Socket Init
    const socket = io();
    socket.emit('mesh:join', { user: survivorName });

    socket.on('mesh:message', (data) => {
      renderMeshMessage(data);
    });

    socket.on('mesh:presence', (data) => {
      showToast(`${data.user} ist ${data.status === 'online' ? 'beigetreten' : 'gegangen'}`);
    });

    function renderMeshMessage(data) {
      const isMe = data.from === survivorName;
      const el = document.createElement('div');
      el.className = `msg ${isMe ? 'user' : 'ai mesh'}`;
      el.innerHTML = `
        <div class="meta">${data.from} • ${new Date(data.timestamp).toLocaleTimeString()}</div>
        <div class="content">${DOMPurify.sanitize(data.content)}</div>
      `;
      $('meshChat').appendChild(el);
      if (currentTab === 'mesh') scrollToBottom($('meshChat'));
    }

    // ── Tab Switching ──
    const btnAgents = $('tabAgents');
    const btnMesh = $('tabMesh');
    const chatAgents = $('chat');
    const chatMesh = $('meshChat');

    btnAgents.onclick = () => {
      currentTab = 'agents';
      btnAgents.classList.add('active');
      btnMesh.classList.remove('active');
      chatAgents.classList.remove('hidden');
      chatMesh.classList.add('hidden');
    };

    btnMesh.onclick = () => {
      currentTab = 'mesh';
      btnMesh.classList.add('active');
      btnAgents.classList.remove('active');
      chatMesh.classList.remove('hidden');
      chatAgents.classList.add('hidden');
      scrollToBottom(chatMesh);
    };

    let history = [];
    let streaming = false;
    let abortCtrl = null;
    let toastTimer = null;

    // ── Init ──
    fetch(`${API}/mobile/ping`, { method: 'POST' }).catch(() => {});
    checkHealth();
    updatePowerMetrics();
    setInterval(checkHealth, 30000);
    setInterval(updatePowerMetrics, 10000);

    async function updatePowerMetrics() {
      try {
        const res = await fetch(`${API}/system/power`);
        const data = await res.json();
        
        const cpuEl = $('pwr-cpu');
        const memEl = $('pwr-mem');
        const uptEl = $('pwr-upt');

        if (cpuEl) {
          cpuEl.textContent = `CPU: ${data.cpu}%`;
          cpuEl.style.color = data.cpu > 80 ? '#ef4444' : (document.documentElement.getAttribute('data-theme') === 'tactical' ? 'var(--green-light)' : 'var(--text-dim)');
        }
        if (memEl) {
          memEl.textContent = `MEM: ${data.memUsedMB}/${data.memTotalMB} MB`;
        }
        if (uptEl) {
          const h = Math.floor(data.uptimeS / 3600);
          const m = Math.floor((data.uptimeS % 3600) / 60);
          uptEl.textContent = `UP: ${h}h ${m}m`;
        }
      } catch (err) {
        // Silent fail for metrics
      }
    }

    // ── Events ──
    sendBtn.addEventListener('click', send);
    $('btn-clear').addEventListener('click', clearChat);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener('input', autoResize);

    // Fix 10 & interne Links: Click Delegation am Chat-Fenster
    chat.addEventListener('click', (e) => {
      const card = e.target.closest('.welcome-card');
      if (card) {
        const prompt = card.dataset.prompt;
        if (prompt) {
          input.value = prompt;
          send();
        }
        return;
      }

      const link = e.target.closest('a');
      if (link && link.href) {
        const url = new URL(link.href, window.location.origin);
        if (url.origin === window.location.origin) {
          e.preventDefault(); // 404 in der SPA verhindern
        } else {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
      }
    });

    // Fix 11: Skill Chips — tap to fill input
    document.querySelectorAll('#mobile-skill-chips .skill-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const trigger = chip.dataset.trigger;
        if (trigger) {
          input.value = trigger + ' ';
          input.focus();
        }
      });
    });

    // ── Kamera / Bild-Anhang (E4B Vision) ──
    let attachedImageB64 = null;
    const cameraBtn  = $('camera-btn');
    const imgInput   = $('img-input');
    const previewBar = $('img-preview-bar');
    const previewThumb = $('img-preview-thumb');
    const previewName  = $('img-preview-name');
    const imgRemoveBtn = $('img-remove-btn');

    if (cameraBtn && imgInput) {
      cameraBtn.addEventListener('click', () => imgInput.click());
      imgInput.addEventListener('change', e => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          attachedImageB64 = ev.target.result.split(',')[1];
          cameraBtn.classList.add('has-image');
          if (previewBar) {
            previewBar.style.display = 'flex';
            previewThumb.src = ev.target.result;
            previewName.textContent = file.name;
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function clearAttachedImage() {
      attachedImageB64 = null;
      if (imgInput) imgInput.value = '';
      if (cameraBtn) cameraBtn.classList.remove('has-image');
      if (previewBar) previewBar.style.display = 'none';
      if (previewThumb) previewThumb.src = '';
      if (previewName) previewName.textContent = '';
    }

    if (imgRemoveBtn) imgRemoveBtn.addEventListener('click', clearAttachedImage);


    // ── Mic (Whisper) ──
    let mediaRec = null, audioChunks = [];
    micBtn.addEventListener('click', toggleMic);

    async function toggleMic() {
      if (mediaRec && mediaRec.state === 'recording') {
        mediaRec.stop();
        micBtn.classList.remove('recording');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRec = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        audioChunks = [];
        mediaRec.ondataavailable = e => audioChunks.push(e.data);
        mediaRec.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          if (blob.size < 1000) return;
          showToast('📝 Transkribiere…');
          const fd = new FormData();
          fd.append('file', blob, 'voice.webm');
          try {
            const res = await fetch(`${API}/audio/transcribe`, { method: 'POST', body: fd });
            const data = await res.json();
            if (data.text && data.text.trim()) {
              input.value = data.text.trim();
              autoResize();
              send(true);
            }
          } catch (e) { showToast('⚠ Transkription fehlgeschlagen'); }
        };
        mediaRec.start();
        micBtn.classList.add('recording');
      } catch { showToast('⚠ Mikrofon nicht verfügbar'); }
    }

    // ── Send ──
    function send(isVoice = false) {
      if (streaming) { if (abortCtrl) abortCtrl.abort(); return; }
      const text = input.value.trim();
      if (!text) return;

      if (currentTab === 'mesh') {
        socket.emit('mesh:message', { content: text });
        input.value = '';
        autoResize();
        return;
      }

      input.value = '';
      autoResize();
      if (welcome) welcome.classList.add('hidden'); // Fix: use hide

      // Bild-Referenz SICHERN bevor clearAttachedImage() aufgerufen wird
      const imageToSend = attachedImageB64;
      clearAttachedImage(); // UI-Preview sofort entfernen (gutes UX-Feedback)

      addBubble('user', text, imageToSend); // Bild auch in User-Bubble anzeigen
      history.push({ role: 'user', content: text });
      streamResponse(text, isVoice, imageToSend); // gesichertes Bild übergeben
    }

    async function streamResponse(text, isVoice, imageB64 = null) {
      streaming = true;
      sendBtn.textContent = '⏹';
      sendBtn.classList.add('stop');
      input.disabled = true;

      const bubble = addBubble('ai', '');
      bubble.classList.add('streaming');
      let full = '';

      try {
        abortCtrl = new AbortController();
        const res = await fetch(`${API}/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, model: MODEL, history, autonomous: true, images: imageB64 ? [imageB64] : [] }),
          signal: abortCtrl.signal,
        });

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let evt;
            try { evt = JSON.parse(line.slice(6).trim()); } catch { continue; }

            switch (evt.type) {
              case 'chunk':
                full += evt.data;
                bubble.textContent += evt.data;
                // Collapse thinking when answer starts
                const thinkEl = bubble.parentElement?.querySelector('.mobile-thinking');
                if (thinkEl && !thinkEl.classList.contains('collapsed')) {
                  thinkEl.classList.add('collapsed');
                }
                scrollBottom();
                break;

              case 'thinking_start':
                showToast('🧠 Denke nach…');
                // Create thinking bubble above AI bubble
                if (!bubble.parentElement?.querySelector('.mobile-thinking')) {
                  const think = document.createElement('div');
                  think.className = 'mobile-thinking';
                  think.innerHTML = '<span class="think-label">💭 Thinking</span><span class="think-text"></span>';
                  bubble.parentElement?.insertBefore(think, bubble);
                }
                break;

              case 'thinking':
                const thinkText = bubble.parentElement?.querySelector('.think-text');
                if (thinkText) {
                  thinkText.textContent += evt.data;
                  thinkText.scrollTop = thinkText.scrollHeight;
                }
                break;

              case 'activity':
                showToast(`⬡ ${evt.cmd}`);
                break;

              case 'reflect':
                if (evt.status === 'running') showToast('🔍 Qualitätsprüfung…');
                break;

              case 'revision':
                full = '';
                bubble.textContent = '';
                showToast('🔄 Überarbeitung…');
                break;

              case 'replace_text':
                full = evt.text || full;
                bubble.textContent = full;
                break;

              // ── Swarm V2 Events ──────────────────────────────
              case 'swarm_status':
                showToast(`🐝 Swarm: ${evt.phase}`);
                if (!bubble.parentElement?.querySelector('.mobile-swarm')) {
                  const sw = document.createElement('div');
                  sw.className = 'mobile-swarm';
                  sw.innerHTML = `<div class="sw-header">🐝 Swarm <span class="sw-phase">${evt.phase}</span></div><div class="sw-agents"></div>`;
                  bubble.parentElement?.insertBefore(sw, bubble);
                } else {
                  const ph = bubble.parentElement.querySelector('.sw-phase');
                  if (ph) ph.textContent = evt.phase;
                }
                scrollBottom();
                break;

              case 'agent_spawned':
                showToast(`⚡ Agent: ${evt.role}`);
                {
                  const agents = bubble.parentElement?.querySelector('.sw-agents');
                  if (agents) {
                    const card = document.createElement('div');
                    card.className = 'sw-agent spawned';
                    card.id = `m-agent-${evt.agent_id}`;
                    card.innerHTML = `<span class="sw-dot"></span><span class="sw-role">${evt.role}</span><span class="sw-task">${(evt.subtask||'').slice(0,40)}</span>`;
                    agents.appendChild(card);
                  }
                }
                scrollBottom();
                break;

              case 'agent_progress':
                {
                  const ac = document.getElementById(`m-agent-${evt.agent_id}`);
                  if (ac) ac.className = `sw-agent ${evt.status}`;
                }
                break;

              case 'agent_terminated':
                {
                  const tc = document.getElementById(`m-agent-${evt.agent_id}`);
                  if (tc) {
                    tc.className = 'sw-agent terminated';
                  }
                }
                break;

              case 'swarm_done':
                showToast(`🐝 Swarm fertig: ${evt.agent_count} Agenten`);
                {
                  const ph = bubble.parentElement?.querySelector('.sw-phase');
                  if (ph) ph.textContent = '✅ done';
                  const hdr = bubble.parentElement?.querySelector('.sw-header');
                  if (hdr) hdr.classList.add('sw-complete');
                }
                scrollBottom();
                break;

              case 'error':
                bubble.textContent = `⚠ ${evt.msg}`;
                showToast(`⚠ ${evt.msg}`, true);
                break;

              case 'done':
                break;
            }
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') {
          showToast('🛑 Abgebrochen');
        } else {
          bubble.textContent = `⚠ Verbindungsfehler`;
          showToast('⚠ Fehler', true);
        }
      }

      // Finalize
      bubble.classList.remove('streaming');
      if (full) {
        // Markdown rendern
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          bubble.innerHTML = DOMPurify.sanitize(marked.parse(full));
        }
        // Vorlesen-Button
        const speakBtn = document.createElement('button');
        speakBtn.className = 'speak-btn';
        speakBtn.textContent = _t('🔊 Vorlesen', '🔊 Listen');
        speakBtn.onclick = () => speakText(full, speakBtn);
        bubble.appendChild(speakBtn);

        history.push({ role: 'assistant', content: full });

        // Auto-Vorlesen bei Sprachmodus
        if (isVoice) speakText(full);
      }

      streaming = false;
      sendBtn.textContent = '➤';
      sendBtn.classList.remove('stop');
      input.disabled = false;
      input.focus();
      scrollBottom();
    }

    // ── TTS ──
    let currentAudio = null;
    async function speakText(text, btn = null) {
      if (currentAudio && !currentAudio.paused) { currentAudio.pause(); currentAudio = null; if (btn) btn.textContent = _t('🔊 Vorlesen', '🔊 Listen'); return; }
      let clean = text.replace(/```[\s\S]*?```/g, ' Codeblock. ').replace(/<[^>]+>/g, '').replace(/[*_~`#\[\]()]/g, '').trim();
      if (!clean) return;
      if (btn) btn.textContent = _t('⏳ Lade…', '⏳ Loading…');
      try {
        const voice = localStorage.getItem('mimi_nox_voice') || 'de-DE-KillianNeural';
        const res = await fetch(`${API}/audio/synthesize`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: clean, voice }) });
        if (!res.ok) throw 0;
        const data = await res.json();
        currentAudio = new Audio(data.audio_url);
        currentAudio.onended = () => { if (btn) btn.textContent = _t('🔊 Vorlesen', '🔊 Listen'); };
        if (btn) btn.textContent = _t('⏹ Stopp', '⏹ Stop');
        await currentAudio.play();
      } catch { if (btn) btn.textContent = _t('🔊 Vorlesen', '🔊 Listen'); }
    }

    // ── Helpers ──
    function addBubble(role, text, imageB64 = null) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      // Bild-Thumbnail in User-Message anzeigen
      if (imageB64 && role === 'user') {
        const img = document.createElement('img');
        img.src = `data:image/jpeg;base64,${imageB64}`;
        img.style.cssText = 'max-width:180px;max-height:180px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px;border:1px solid rgba(34,197,94,0.3)';
        img.alt = 'Hochgeladenes Bild';
        div.appendChild(img);
      }
      if (text) {
        const p = document.createElement('span');
        p.textContent = text;
        div.appendChild(p);
      }
      chat.appendChild(div);
      scrollBottom();
      return div;
    }

    function scrollBottom() {
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    }

    function clearChat() {
      history = [];
      chat.innerHTML = `<div class="welcome-msg" id="welcome"><span class="icon">◑</span><div class="title">Hey 👋</div>Schreib mir – ich bin dein lokaler KI-Agent.</div>`;
      input.value = '';
      autoResize();
      input.focus();
    }

    function showToast(text, isError = false) {
      toast.textContent = text;
      toast.style.color = isError ? '#fca5a5' : 'var(--green-light)';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    async function checkHealth() {
      const label = $('status-label');
      try {
        const res = await fetch(`${API}/health`, { signal: AbortSignal.timeout(5000) });
        const data = await res.json();
        const isOnline = data.ollamaReady;
        const isAirGapped = data.airGapped;

        statusDot.classList.toggle('offline', !isOnline);
        
        // Auto-apply tactical theme if air-gapped
        if (isAirGapped) {
          document.documentElement.setAttribute('data-theme', 'tactical');
        } else {
          // Only remove if we're not manually in tactical mode (optional, but for now auto)
          document.documentElement.removeAttribute('data-theme');
        }

        if (label) {
          if (isAirGapped) {
            label.innerHTML = '🔒 LOKAL (AIR-GAPPED)';
            label.className = 'status-label tactical';
          } else {
            label.innerHTML = isOnline ? 'Online' : 'Offline';
            label.className = 'status-label' + (isOnline ? '' : ' offline');
          }
        }
      } catch {
        statusDot.classList.add('offline');
        if (label) {
          label.textContent = 'Offline';
          label.className = 'status-label offline';
        }
      }
    }
  </script>
</body>
</html>
